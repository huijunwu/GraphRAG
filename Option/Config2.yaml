llm:
  api_type: "openai"         # or openai
  base_url: "http://localhost:4000/v1"
  model: "o1-mini"
  # api_key: "sk-1234567890abcdef1234567890abcdef"

embedding:
  api_type: "openai"         # or ollama / openai
  base_url: "http://localhost:4000/v1"
  model: "text-embedding-ada-002"
  cache_dir: ""
  dimensions: 1024
  max_token_size: 8192
  embed_batch_size: 128
  embedding_func_max_async: 16
  # api_key: "sk-1234567890abcdef1234567890abcdef"

data_root: "./datasets"       # Root directory for data
working_dir: "./my_result"    # Result directory for the experiment
exp_name: "my_test"           # Experiment name
